name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/le-garage-recipe-bot
            git pull origin master
            npm install --omit=dev
            # Every process defined in ecosystem.config.js, not just recipe-bot:
            # recipe-bot-boho and recipe-sync run the same code and used to keep
            # running the pre-deploy version indefinitely. startOrReload also
            # starts anything that isn't registered on the box yet.
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
            echo "✅ Deploy complete"
